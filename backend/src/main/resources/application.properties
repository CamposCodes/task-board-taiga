spring.application.name=taskboard

server.port=${PORT:8080}
server.forward-headers-strategy=native
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/taskboard}
spring.datasource.username=${DB_USER:taskboard}
spring.datasource.password=${DB_PASSWORD:taskboard}
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.mvc.problemdetails.enabled=true

management.endpoints.web.exposure.include=health
management.health.mail.enabled=false

springdoc.swagger-ui.path=/swagger-ui
springdoc.packages-to-scan=com.r2da.taskboard

app.jwt-secret=${APP_JWT_SECRET:}
app.session-ttl=${APP_SESSION_TTL:7d}
app.admin-password=${APP_ADMIN_PASSWORD:}
app.cookie-secure=${APP_COOKIE_SECURE:true}
app.public-url=${APP_PUBLIC_URL:http://localhost:3000}

app.oidc.issuer=${APP_OIDC_ISSUER:}
app.oidc.client-id=${APP_OIDC_CLIENT_ID:taskboard}
app.oidc.client-secret=${APP_OIDC_CLIENT_SECRET:}
app.oidc.label=${APP_OIDC_LABEL:Keycloak}

spring.mvc.format.date=iso
spring.mvc.format.date-time=iso
app.time-zone=${APP_TIME_ZONE:America/Sao_Paulo}

app.files-dir=${APP_FILES_DIR:./data/files}
spring.servlet.multipart.max-file-size=${APP_MAX_UPLOAD:20MB}
spring.servlet.multipart.max-request-size=${APP_MAX_UPLOAD:20MB}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=20000
spring.mail.properties.mail.smtp.writetimeout=20000
app.mail.from=${MAIL_FROM:taskboard@localhost}
app.mail.poll=${MAIL_POLL:15s}
